# VLM Prompts Configuration for ProPS-V
# All Vision-Language Model prompts and text templates

# ========================================
# VLMAnalyzer Prompts
# ========================================

vlm_analyzer:
  # Main analysis prompt for critical frames
  analysis_prompt:
    system_instruction: "You are an expert RL policy analyst. Analyze the following critical frames from a policy rollout and provide diagnostic feedback."
    
    environment_section: |
      # Environment:
      {env_description}
    
    episode_summary_section: |
      # Episode Summary:
      - Total Reward: {episode_reward:.2f}
      - Early Termination: {termination_status}
      - Number of Critical Frames: {num_frames}
    
    critical_frames_intro: |
      # Critical Frames:
      I will show you {num_frames} critical frames from this episode. Each frame represents a pivotal moment:
      - 'init': Initial state
      - 'term': Terminal state
      - 'fail': Failure state (early termination)
      - 'trans': Transition state (significant reward change)
    
    task_instruction: |
      # Your Task:
      Analyze these frames and provide:
      1. **Visual Observations**: What do you see happening in the frames? Describe the agent's behavior, position, and any notable patterns.
      2. **Failure Analysis**: If the episode failed, what visual cues indicate the failure mode? What mistakes did the policy make?
      3. **Success Patterns**: If the episode succeeded or showed improvement, what behaviors should be reinforced?
      4. **Parameter Adjustment Recommendations**: Based on the visual evidence, which policy parameters should be increased, decreased, or kept stable? Be specific.

      Provide a concise but thorough analysis (3-5 sentences per section). Focus on actionable insights.
    
    frame_info_template: |
      Frame {frame_num} (t={timestep}, type={frame_type}):
        Reward at this step: {reward:.4f}
    
    frame_state_template: "  State: {state}"
    frame_action_template: "  Action: {action}"
    
    termination_status:
      early: "Yes (FAILURE)"
      normal: "No (completed successfully)"
  
  # Trajectory comparison prompt
  trajectory_comparison_prompt:
    system_instruction: "You are an expert RL policy analyst. Compare two policy trajectories."
    
    environment_section: |
      # Environment:
      {env_description}
    
    comparison_section: |
      # Trajectory Comparison:
      - Previous Reward: {reward_previous:.2f}
      - Current Reward: {reward_current:.2f}
      - Change: {reward_change:+.2f}
    
    task_instruction: |
      I will show you critical frames from both trajectories. Analyze:
      1. What visual differences explain the reward change?
      2. Did the behavior improve or regress? How?
      3. What should the next policy iteration focus on?

      Provide concise, actionable insights (2-3 sentences per point).

# ========================================
# Visual Guidance Instructions for LLM
# ========================================

visual_guidance:
  instruction: |
    # Using Visual and Numerical Feedback:
    
    You receive both **Visual Analysis** (what the agent did) and **Numerical Rewards** (historical patterns).
    
    ## Decision Guidelines:
    
    **Prioritize Visual when:**
    - Agent crashes, falls, or fails early
    - Clear behavioral problems (wrong direction, instability, collisions)
    - Rewards plateaued with suboptimal behavior
    → Fix root causes first, even if reward temporarily drops
    
    **Prioritize Numerical when:**
    - Behavior is stable and reasonable
    - Clear parameter-reward correlations exist
    - Fine-tuning a working policy
    → Follow reward trends for optimization
    
    **Balance Both when:**
    - Signals conflict or partial success observed
    - First ensure SAFE behavior, then optimize numerically
    - If forced to choose: visual correctness > numerical reward
    
    ## Quality Check:
    - Good visual: specific details, concrete failures, actionable recommendations
    - Good numerical: enough data (5+ examples), consistent trends, low variance
    - If visual vague → rely on numerical. If rewards noisy → rely on visual
    
    ## Process:
    1. Identify critical visual issues (crashes, violations)
    2. Check numerical patterns (parameter correlations)
    3. Decide: fix visual problems OR optimize numerically
    4. Propose parameters explaining reasoning from BOTH sources
    
    Visual = ground truth behavior. Numerical = statistical patterns. Use judgment to balance both.

# ========================================
# Error Messages
# ========================================

error_messages:
  vlm_analysis_failed: "VLM analysis failed after {max_retries} attempts: {error}"
  vlm_analysis_unavailable: "VLM analysis unavailable"
  comparison_failed: "Comparison failed: {error}"
  comparison_unavailable: "Comparison unavailable"
  vlm_error_attempt: "[VLM ERROR] Attempt {attempt}/{max_retries}: {error}"
  vlm_comparison_error: "[VLM COMPARISON ERROR] Attempt {attempt}/{max_retries}: {error}"
