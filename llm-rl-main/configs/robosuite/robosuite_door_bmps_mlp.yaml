task: cont_state_llm_num_optim_vision
num_episodes: 100
gym_env_name: RoboSuiteDoorDiscrete-v0
render_mode: rgb_array
logdir: logs/robosuite_door_bmps_mlp
dim_actions: 15
dim_states: 64
max_traj_count: 256
max_traj_length: 400
template_dir: agent/policy/templates
llm_si_template_name: num_optim_vision.j2
llm_output_conversion_template_name: num_optim_vision.j2
llm_model_name: nvidia_nim/openai/gpt-oss-120b
num_evaluation_episodes: 3
warmup_episodes: 10
warmup_dir: null
bias: true
optimum: 300
search_step_size: 0.5
env_desc_file: env_descriptions/robosuite_door_discrete.j2

optimization_mode: latent
policy_type: mlp
hidden_sizes: [32, 32]
hidden_activation: tanh
output_activation: tanh
latent_dim: 32
projection_seed: 42
projection_scale: 0.25
projection_refresh_interval: 20
vlm_frame_mode: individual
vlm_model_name: nvidia_nim/google/gemma-4-31b-it
decay_horizon: 50
frame_sample_period: 20
n_neighbors: 3
poisson_lam: 2.0
neighbor_step: 0.1
enable_vision: true

env_kwargs:
  env_name: Door
  robot: Panda
  camera_name: agentview
  horizon: 400
  reward_shaping: false
  state_dim: 64
  translation_delta: 0.5
  rotation_delta: 0.5
  include_rotation_actions: true
  gripper_open_value: -1.0
  gripper_close_value: 1.0
  state_keys:
    - robot0_proprio-state
    - object-state

ablate_anchor: null
llm_api_key: null
llm_api_base: null
vlm_api_key: null
vlm_api_base: null
