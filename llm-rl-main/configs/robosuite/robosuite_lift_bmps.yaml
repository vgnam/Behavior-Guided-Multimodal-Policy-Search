task: cont_state_llm_num_optim_vision
num_episodes: 100
gym_env_name: RoboSuiteLiftDiscrete-v0
render_mode: rgb_array
logdir: logs/robosuite_lift_bmps
dim_actions: 9
dim_states: 64
max_traj_count: 256
max_traj_length: 200
template_dir: agent/policy/templates
llm_si_template_name: num_optim_vision.j2
llm_output_conversion_template_name: num_optim_vision.j2
llm_model_name: openrouter/openai/gpt-oss-120b:free
num_evaluation_episodes: 3
warmup_episodes: 10
warmup_dir: null
bias: true
optimum: 300
search_step_size: 0.5
env_desc_file: env_descriptions/robosuite_lift_discrete.j2

# BMPS specific parameters
vlm_model_name: openrouter/google/gemma-3-27b-it
decay_horizon: 50
frame_sample_period: 10
n_neighbors: 3
poisson_lam: 2.0
neighbor_step: 0.1
enable_vision: true

env_kwargs:
  env_name: Lift
  robot: Panda
  camera_name: agentview
  horizon: 200
  reward_shaping: true
  state_dim: 64
  translation_delta: 1.0
  gripper_open_value: -1.0
  gripper_close_value: 1.0
  state_keys:
    - robot0_proprio-state
    - object-state

# Ablation study: remove one anchor from neighborhood prompt
# Options: null, current, best, worst
ablate_anchor: null

# Optional: override LLM API credentials (falls back to env vars if null)
llm_api_key: null
llm_api_base: null
# Optional: override VLM API credentials (falls back to env vars if null)
vlm_api_key: null
vlm_api_base: null
