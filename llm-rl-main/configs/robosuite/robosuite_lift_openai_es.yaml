task: cont_space_openai_es
num_episodes: 100
gym_env_name: RoboSuiteLiftDiscrete-v0
render_mode: null
logdir: logs/robosuite_lift_openai_es
dim_actions: 9
dim_states: 64
max_traj_count: 1
max_traj_length: 200
num_evaluation_episodes: 5
warmup_episodes: 0
warmup_dir: null
bias: true
env_kwargs:
  env_name: Lift
  robot: Panda
  camera_name: agentview
  horizon: 200
  reward_shaping: true
  state_dim: 64
  translation_delta: 1.0
  gripper_open_value: -1.0
  gripper_close_value: 1.0
  state_keys:
    - robot0_proprio-state
    - object-state

# OpenAI-ES baseline hyperparameters
population_size: 16
sigma: 0.1
learning_rate: 0.03
candidate_evaluation_episodes: 1
use_centered_ranks: true
use_adam: true
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
weight_decay: 0.0
seed: 42
