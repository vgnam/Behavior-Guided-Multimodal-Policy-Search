task: cont_state_llm_num_optim_vision
num_episodes: 400
gym_env_name: BipedalWalker-v3
render_mode: rgb_array
logdir: logs/bipedalwalker_propsv_gpt-oss
dim_actions: 4
dim_states: 24
max_traj_count: 1000
max_traj_length: 1000
template_dir: agent/policy/templates
llm_si_template_name: num_optim_vision.j2
llm_output_conversion_template_name: num_optim_vision.j2
llm_model_name: openrouter/openai/gpt-oss-120b:free
num_evaluation_episodes: 20
warmup_episodes: 20
warmup_dir: null
bias: true
optimum: 300
search_step_size: 0.1
env_desc_file: env_descriptions/bipedalwalker.j2

# ProPS-V specific parameters
vlm_model_name: nvidia_nim/google/gemma-3-27b-it
decay_horizon: 100
frame_sample_period: 50
n_neighbors: 5
poisson_lam: 2.0
neighbor_step: 0.1
enable_vision: true

# Ablation study: remove one anchor from neighborhood prompt
# Options: null, current, best, worst
ablate_anchor: null
