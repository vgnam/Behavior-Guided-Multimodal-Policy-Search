task: cont_state_llm_num_optim_vision
num_episodes: 400
gym_env_name: gym_navigation:NavigationTrack-v0
render_mode: rgb_array  # Required for frame capture
logdir: logs/nav_propsv
dim_actions: 3
dim_states: 5
max_traj_count: 1000
max_traj_length: 1000
template_dir: agent/policy/templates
llm_si_template_name: num_optim_vision.j2
llm_output_conversion_template_name: num_optim_vision.j2
llm_model_name: nvidia_nim/qwen/qwen3-235b-a22b
num_evaluation_episodes: 20
warmup_episodes: 20
warmup_dir: null
bias: true
optimum: 2500
search_step_size: 1.0
env_desc_file: env_descriptions/nav.j2

# ProPS-V specific parameters
vlm_model_name: nvidia_nim/google/gemma-3-27b-it
decay_horizon: 100
frame_sample_period: 50
enable_vision: true
n_neighbors: 5        # Number of Poisson-perturbed neighbors per anchor
poisson_lam: 2.0      # Lambda (mean) of Poisson distribution for step sizes
neighbor_step: 0.1   # Base step size multiplied by Poisson sample

# Ablation study: remove one anchor from neighborhood prompt
# Options: null, current, best, worst
ablate_anchor: null
