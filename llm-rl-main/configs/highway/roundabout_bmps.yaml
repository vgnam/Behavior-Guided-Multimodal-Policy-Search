task: cont_state_llm_num_optim_vision
num_episodes: 300
gym_env_name: roundabout-v0
render_mode: rgb_array
logdir: logs/roundabout_bmps
dim_actions: 5
dim_states: 25
max_traj_count: 1000
max_traj_length: 100
template_dir: agent/policy/templates
llm_si_template_name: num_optim_vision.j2
llm_output_conversion_template_name: num_optim_vision.j2
llm_model_name: gpt-4o
num_evaluation_episodes: 20
warmup_episodes: 20
warmup_dir: null
bias: true
optimum: 40
search_step_size: 0.5
env_desc_file: env_descriptions/roundabout.j2
env_kwargs:
  flatten_observation: true

# BMPS specific parameters
vlm_model_name: nvidia_nim/google/gemma-3-27b-it
decay_horizon: 100
frame_sample_period: 50
enable_vision: true
n_neighbors: 5
poisson_lam: 2.0
neighbor_step: 0.1

# Ablation study: remove one anchor from neighborhood prompt
# Options: null, current, best, worst
ablate_anchor: null

# Optional: override LLM API credentials (falls back to env vars if null)
llm_api_key: null
llm_api_base: null
# Optional: override VLM API credentials (falls back to env vars if null)
vlm_api_key: null
vlm_api_base: null
