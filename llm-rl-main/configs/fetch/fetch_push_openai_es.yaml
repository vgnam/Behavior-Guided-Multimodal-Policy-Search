task: cont_space_openai_es
num_episodes: 400
gym_env_name: FetchPush-v4
render_mode: null
logdir: logs/fetch_push_openai_es
dim_actions: 4
dim_states: 31
max_traj_count: 1000
max_traj_length: 50
num_evaluation_episodes: 20
warmup_episodes: 20
warmup_dir: null
bias: true

# OpenAI-ES baseline hyperparameters
population_size: 32
sigma: 0.1
learning_rate: 0.03
candidate_evaluation_episodes: 1
use_centered_ranks: true
use_adam: true
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
weight_decay: 0.0

env_kwargs:
  # Fetch returns goal-dict observations; flatten for linear policies.
  flatten_observation: true
  # Dense shaping is easier for policy search than sparse success-only reward.
  reward_type: dense
