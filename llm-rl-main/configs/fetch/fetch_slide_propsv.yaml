task: cont_state_llm_num_optim_vision
num_episodes: 400
gym_env_name: FetchSlide-v4
render_mode: rgb_array
logdir: logs/fetch_slide_propsv
dim_actions: 4
dim_states: 31
max_traj_count: 1000
max_traj_length: 50
template_dir: agent/policy/templates
llm_si_template_name: num_optim_vision.j2
llm_output_conversion_template_name: num_optim_vision.j2
llm_model_name: gpt-4o
num_evaluation_episodes: 20
warmup_episodes: 20
warmup_dir: null
bias: true
optimum: 0
search_step_size: 0.1
env_desc_file: env_descriptions/fetch_slide.j2
env_kwargs:
  flatten_observation: true
  reward_type: dense

# ProPS-V specific parameters
vlm_model_name: nvidia_nim/google/gemma-3-27b-it
decay_horizon: 100
frame_sample_period: 50
n_neighbors: 5
poisson_lam: 2.0
neighbor_step: 0.1
enable_vision: true