task: blprops
num_episodes: 400
gym_env_name: Hopper-v5
render_mode: rgb_array         # Required for VLM frame capture
logdir: logs/hopper_blprops
dim_actions: 3
dim_states: 11
max_traj_count: 1000
max_traj_length: 1000
template_dir: agent/policy/templates
llm_hypothesis_template_name: blprops_step1_hypothesis.j2    # STEP 1: LLM → b_hyp
llm_proposal_template_name: blprops_step3_proposal.j2        # STEP 3: LLM → θ
llm_model_name: nvidia_nim/qwen/qwen3-235b-a22b
num_evaluation_episodes: 20
warmup_episodes: 20
warmup_dir: null
bias: true
optimum: 1000
search_step_size: 0.1
env_desc_file: env_descriptions/hopper.j2

# BL-ProPS VLM parameters
vlm_model_name: nvidia_nim/google/gemma-3-27b-it
frame_sample_period: 50
