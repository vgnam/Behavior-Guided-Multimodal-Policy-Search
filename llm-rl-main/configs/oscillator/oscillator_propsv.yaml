task: cont_state_llm_num_optim_vision
num_episodes: 400
gym_env_name: stable_gym/Oscillator-v1
render_mode: rgb_array  # Required for frame capture
logdir: logs/oscillator_propsv
dim_actions: 3
dim_states: 8
max_traj_count: 1000
max_traj_length: 400
template_dir: agent/policy/templates
llm_si_template_name: num_optim_vision.j2
llm_output_conversion_template_name: num_optim_vision.j2
llm_model_name: gpt-4o
num_evaluation_episodes: 20
warmup_episodes: 20
warmup_dir: null
bias: true
optimum: 300
search_step_size: 0.05
env_desc_file: env_descriptions/oscillator.j2

# ProPS-V specific parameters
vlm_model_name: nvidia_nim/google/gemma-3-27b-it
decay_horizon: 100
frame_sample_period: 40
enable_vision: true
n_neighbors: 5
poisson_lam: 2.0
neighbor_step: 0.05

# Ablation study: remove one anchor from neighborhood prompt
# Options: null, current, best, worst
ablate_anchor: null
