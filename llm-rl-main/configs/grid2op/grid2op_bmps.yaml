task: cont_state_llm_num_optim_vision
num_episodes: 100
gym_env_name: Grid2OpCase14-v0
render_mode: rgb_array
logdir: logs/grid2op_case14_bmps
dim_actions: 41
dim_states: 40
max_traj_count: 256
max_traj_length: 100
template_dir: agent/policy/templates
llm_si_template_name: num_optim_vision.j2
llm_output_conversion_template_name: num_optim_vision.j2
llm_model_name: nvidia_nim/openai/gpt-oss-120b
num_evaluation_episodes: 3
warmup_episodes: 10
warmup_dir: null
bias: true
optimum: 2000
search_step_size: 0.2
env_desc_file: env_descriptions/grid2op_case14.j2

# BMPS specific parameters
vlm_model_name: openrouter/google/gemma-3-27b-it
decay_horizon: 50
frame_sample_period: 10
n_neighbors: 3
poisson_lam: 2.0
neighbor_step: 0.1
enable_vision: true

env_kwargs:
  grid2op_env_name: l2rpn_case14_sandbox
  reward_class_name: L2RPNReward
  observation_features:
    - rho
    - line_status

# Ablation study: remove one anchor from neighborhood prompt
# Options: null, current, best, worst
ablate_anchor: null

# Optional: override LLM API credentials (falls back to env vars if null)
llm_api_key: null
llm_api_base: null
# Optional: override VLM API credentials (falls back to env vars if null)
vlm_api_key: null
vlm_api_base: null
